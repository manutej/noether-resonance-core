<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Noether Resonance Core — Quantum Field 3D Audio & Speech Visualizer (v2.0 Gold)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #05060b;
  --ink-raise: rgba(10, 13, 22, 0.78);
  --ink-drawer: rgba(8, 11, 19, 0.90);
  --fg: #eef1f7;
  --fg-dim: rgba(238, 241, 247, 0.56);
  --line: rgba(238, 241, 247, 0.12);
  --line-bright: rgba(238, 241, 247, 0.28);
  --accent: #7ea8be;
  --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--fg);
  font-family: var(--sans);
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
  cursor: grab;
}
#stage:active { cursor: grabbing; }

/* Subtle vignette that never obscures the 3D field */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(circle at 50% 48%, transparent 50%, rgba(2, 3, 7, 0.72) 100%);
}

.hud {
  position: fixed;
  z-index: 2;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
body.ui-off .hud {
  opacity: 0;
  pointer-events: none;
}

/* Top-Left Minimal State & Source Indicator */
.id {
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: max(22px, calc(env(safe-area-inset-left, 0px) + 22px));
  display: grid;
  gap: 5px;
  pointer-events: none;
}
.mark {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-dim);
}
.state {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--accent);
  transition: color 0.55s ease;
}
.state .pip {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 18px var(--accent);
  transition: background 0.55s ease, box-shadow 0.55s ease;
}
.src {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--fg-dim);
  max-width: min(72ch, 65vw);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Top-Right Tempo, Harmonic Telemetry & Spectrum Instrument */
.tempo {
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  right: max(22px, calc(env(safe-area-inset-right, 0px) + 22px));
  display: grid;
  justify-items: end;
  gap: 7px;
  pointer-events: none;
  font-family: var(--mono);
}
.bpm {
  display: flex;
  align-items: baseline;
  gap: 7px;
  font-variant-numeric: tabular-nums;
}
.bpm b {
  font-weight: 500;
  font-size: clamp(30px, 4.4vw, 50px);
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--fg);
}
.bpm small {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  color: var(--fg-dim);
}
.lock {
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 3.5px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--fg-dim);
}
.lock[data-on="1"] {
  color: var(--ink);
  background: var(--accent);
  border-color: transparent;
  font-weight: 600;
}
.bar { display: flex; gap: 5px; }
.bar i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  border: 1px solid var(--line);
  transition: background 0.08s linear, transform 0.08s linear;
}
.bar i.on {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(1.16);
}
.meters {
  display: grid;
  gap: 5px;
  width: 132px;
  margin-top: 2px;
}
.meter {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: center;
  gap: 8px;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-dim);
}
.meter span {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.meter span u {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  text-decoration: none;
}
.q-telem {
  font-size: 9.5px;
  letter-spacing: 0.10em;
  color: var(--fg-dim);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

/* Non-Overlapping Bottom Control Dock */
.dock {
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: max-content;
  max-width: calc(100vw - 28px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 8px;
  background: var(--ink-raise);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.grp {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  align-items: center;
}
.grp + .grp {
  padding-left: 6px;
  border-left: 1px solid var(--line);
}
.btn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--fg-dim);
  font: 500 11.5px/1 var(--mono);
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn:hover {
  background: rgba(255, 255, 255, 0.07);
  color: var(--fg);
}
.btn[aria-pressed="true"] {
  color: var(--fg);
  background: color-mix(in srgb, var(--accent) 22%, transparent);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
}
.btn.primary {
  background: var(--accent);
  color: var(--ink);
  font-weight: 600;
}
.btn.primary:hover {
  filter: brightness(1.08);
  background: var(--accent);
  color: var(--ink);
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Non-Overlapping Slim Tweak Bar (Docks cleanly above bottom bar, never over the 3D Orb) */
.tweak-drawer {
  left: 50%;
  transform: translateX(-50%) translateY(14px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
  width: max-content;
  max-width: calc(100vw - 28px);
  background: var(--ink-drawer);
  border: 1px solid var(--line-bright);
  border-radius: 14px;
  padding: 9px 14px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  opacity: 0;
  pointer-events: none;
}
.tweak-drawer.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.tweak-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.tweak-row + .tweak-row {
  padding-top: 6px;
  border-top: 1px solid var(--line);
}
.tweak-lbl {
  font: 500 10px/1 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-dim);
  margin-right: 2px;
}
.swatch-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  color: var(--fg-dim);
  font: 500 11px/1 var(--mono);
  cursor: pointer;
  transition: all 0.15s ease;
}
.swatch-pill:hover {
  color: var(--fg);
  border-color: var(--line-bright);
}
.swatch-pill[aria-pressed="true"] {
  color: var(--fg);
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 18%, transparent);
}
.swatch-dots {
  display: inline-flex;
  gap: 2px;
}
.swatch-dots i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.sl-wrap {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font: 400 10.5px var(--mono);
  color: var(--fg-dim);
  padding: 0 2px;
}
.sl-wrap input[type="range"] {
  width: 56px;
  accent-color: var(--accent);
  cursor: pointer;
}
.sl-select {
  background: rgba(15, 20, 32, 0.92);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 6px;
  font: 400 11px var(--mono);
  padding: 4px 7px;
  max-width: 195px;
  cursor: pointer;
}

.toast {
  left: 50%;
  transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  max-width: min(540px, calc(100vw - 32px));
  font: 400 12px/1.5 var(--mono);
  color: var(--fg);
  background: var(--ink-drawer);
  border: 1px solid var(--line-bright);
  border-radius: 10px;
  padding: 10px 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  backdrop-filter: blur(14px);
}
.toast.show { opacity: 1; }

.drop {
  position: fixed;
  inset: 14px;
  z-index: 3;
  border: 1.5px dashed var(--accent);
  border-radius: 18px;
  display: grid;
  place-items: center;
  font: 500 14px var(--mono);
  color: var(--accent);
  background: rgba(5, 6, 11, 0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
body.dragging .drop { opacity: 1; }

.media-scrub {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  pointer-events: auto;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--fg-dim);
}
.media-scrub.show { display: inline-flex; }
.media-scrub input[type="range"] {
  width: 140px;
  accent-color: var(--accent);
  cursor: pointer;
}
.btn.rec-on {
  color: #ff6b6b;
  border-color: rgba(255, 107, 107, 0.55);
  background: rgba(255, 107, 107, 0.16);
}

@media (max-width: 760px) {
  .meters, .q-telem { display: none; }
  .dock { padding: 5px; gap: 3px; }
  .grp + .grp { padding-left: 0; border-left: 0; }
  .btn { padding: 7px 8px; font-size: 10.5px; }
}
</style>
</head>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ───────────────────────── Sanzo Wada & Monotone Palettes ─────────────────────────

   Models d^2 q_k / dt^2 + 2*zeta*w_k * dq_k/dt + (w_k^2 / freeRoom) * q_k = F_audio_k(t) */
const HAM = {
  q: [0, 0, 0, 0], // Low, Mid, High, Radial Breathing coordinates
  v: [0, 0, 0, 0], // Canonical conjugate velocities
  omega: [8.5, 13.0, 19.5, 5.2],
  zeta: [0.34, 0.38, 0.42, 0.26],
  energy: 0.42     // Conserved + driven Hamiltonian H = T + V
};

function stepHamiltonian(dt, forces, freeRoom) {
  const subDt = Math.min(dt, 0.033) * 0.5;
  const invFree = 1.0 / Math.max(0.35, freeRoom);
  let totalH = 0;
  for (let s = 0; s < 2; s++) {
    for (let i = 0; i < 4; i++) {
      const w = HAM.omega[i] * Math.sqrt(invFree);
      const acc = forces[i] * w * w - 2.0 * HAM.zeta[i] * w * HAM.v[i] - w * w * HAM.q[i];
      HAM.v[i] += acc * subDt;
      HAM.q[i] += HAM.v[i] * subDt;
      HAM.q[i] = clamp(HAM.q[i], -0.45, 1.65);
    }
  }
  for (let i = 0; i < 4; i++) {
    const kinetic = 0.5 * (HAM.v[i] / HAM.omega[i]) ** 2;
    const potential = 0.5 * HAM.q[i] ** 2;
    totalH += (kinetic + potential) * 0.45;
  }
  HAM.energy = lerp(HAM.energy, clamp(0.18 + totalH, 0.12, 2.40), 0.18);
}

  A.media = el; A.mediaNode = A.ctx.createMediaElementSource(el); A.mediaNode.connect(A.master);

function attachStream(stream, kind, label) {
  ensureAudio(); stopAll();
  A.stream = stream;
  A.streamNode = A.ctx.createMediaStreamSource(stream);
  // Connect strictly to analyser (never destination) to prevent speaker feedback loops
  A.streamNode.connect(A.analyser);

async function refreshAudioDevices() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const inputs = devs.filter(d => d.kind === 'audioinput');
    const sel = $('#micDeviceSelect');
    if (inputs.length > 1) {
      sel.innerHTML = inputs.map((d, i) => `<option value="${d.deviceId}">${d.label || ('Audio Input ' + (i + 1))}</option>`).join('');
      sel.style.display = 'inline-block';
    }
  } catch (e) {}
}

async function startMic(preferredDeviceId) {
  ensureAudio();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
    const audioConstraint = {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    };
    if (preferredDeviceId) audioConstraint.deviceId = { exact: preferredDeviceId };
    const s = await navigator.mediaDevices.getUserMedia({ audio: audioConstraint });
    const trackLabel = (s.getAudioTracks()[0] && s.getAudioTracks()[0].label) || 'Live Input';
    attachStream(s, 'mic', 'Mic · ' + trackLabel);
    refreshAudioDevices();
  } catch (e) {
    toast('Microphone access requires http://localhost or HTTPS. Run `node server.js` in noether-resonance-app and open http://localhost:3333.');
  }
}

async function startSystemAudio() {
  ensureAudio();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) throw new Error('unsupported');
    const s = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const audioTracks = s.getAudioTracks();
    s.getVideoTracks().forEach(vt => vt.stop());
    if (!audioTracks.length) {
      toast('No audio track shared. Make sure to check "Share tab/system audio" in the browser picker.');
      return;
    }
    const audioOnlyStream = new MediaStream(audioTracks);
    attachStream(audioOnlyStream, 'sys', 'System / Tab Audio · ' + (audioTracks[0].label || 'Live Stream'));
  } catch (e) {
    toast('To capture System/Tab audio, select a browser tab or screen and toggle "Share audio" on.');
  }
}

function resetTempo() {

    nextBeat: 0, beatCount: 0, accent: [0, 0, 0, 0], downOff: 0, lastOnset: -1

function binOf(hz) { return clamp(Math.round(hz / (A.ctx.sampleRate / A.analyser.fftSize)), 1, A.freq.length - 1); }
function bandAvg(lo, hi) {
  const a = binOf(lo), b = binOf(hi); let s = 0;
  for (let i = a; i <= b; i++) s += A.freq[i];
  return s / ((b - a + 1) * 255);
}

function analyse(now, dt, gain) {
  A.analyser.getByteFrequencyData(A.freq);
  A.analyser.getFloatTimeDomainData(A.time);

  const raw = [bandAvg(25, 180), bandAvg(180, 2200), bandAvg(2200, 12000)];
  const decay = Math.pow(0.5, dt / 4);
  for (let i = 0; i < 3; i++) {
    AN.peaks[i] = Math.max(raw[i], AN.peaks[i] * decay, 0.11);
    const v = clamp((raw[i] / AN.peaks[i]) * gain, 0, 1.45);
    AN.bands[i] += (v - AN.bands[i]) * (v > AN.bands[i] ? 0.55 : 0.13);
  }

  let rms = 0;
  for (let i = 0; i < A.time.length; i += 4) rms += A.time[i] * A.time[i];
  rms = Math.sqrt(rms / (A.time.length / 4));
  AN.level += (clamp(rms * 4.2 * gain, 0, 1.25) - AN.level) * 0.32;

  // Extract Live Speech Formants F1 (250–900 Hz) & F2 (900–2800 Hz) + Spectral Centroid
  const hzPerBin = A.ctx.sampleRate / A.analyser.fftSize;
  const f1Lo = binOf(250), f1Hi = binOf(900);
  let maxF1 = 0, binF1 = f1Lo;
  for (let i = f1Lo; i <= f1Hi; i++) {
    if (A.freq[i] > maxF1) { maxF1 = A.freq[i]; binF1 = i; }
  }
  const f2Lo = binOf(900), f2Hi = binOf(2800);
  let maxF2 = 0, binF2 = f2Lo;
  for (let i = f2Lo; i <= f2Hi; i++) {
    if (A.freq[i] > maxF2) { maxF2 = A.freq[i]; binF2 = i; }
  }
  if (maxF1 > 18) AN.formantF1 = lerp(AN.formantF1, binF1 * hzPerBin, 0.22);
  if (maxF2 > 14) AN.formantF2 = lerp(AN.formantF2, binF2 * hzPerBin, 0.22);

  const bLo = binOf(200), bHi = binOf(3400);
  let num = 0, den = 0.001;
  for (let i = bLo; i <= bHi; i++) {
    const w = A.freq[i] / 255;
    num += ((i - bLo) / (bHi - bLo)) * w;
    den += w;
  }
  AN.centroid = lerp(AN.centroid, clamp(num / den, 0, 1), 0.16);

  const loEnd = binOf(220), midEnd = binOf(2400);
  let flux = 0, full = 0;
  for (let i = 1; i < midEnd; i++) {
    const d = A.freq[i] - A.prev[i];
    if (d > 0) { flux += d * (i < loEnd ? 1 : 0.32); full += d; }
    A.prev[i] = A.freq[i];
  }
  flux /= (loEnd + (midEnd - loEnd) * 0.32) * 255;
  AN.fullFlux = full / (midEnd * 255);

  AN.fluxHist.push({ t: now, v: flux });
  while (AN.fluxHist.length && now - AN.fluxHist[0].t > 1.0) AN.fluxHist.shift();
  let m = 0; AN.fluxHist.forEach(h => m += h.v); m /= AN.fluxHist.length;
  let sd = 0; AN.fluxHist.forEach(h => sd += (h.v - m) * (h.v - m)); sd = Math.sqrt(sd / AN.fluxHist.length);

  if (AN.f1 > thr && AN.f1 >= flux && AN.f1 > AN.f2 && AN.t1 - AN.lastOnset > 0.17) {

  }

function onOnset(t, strength) {
  AN.lastOnset = t;
  AN.onsets.push({ t, s: strength });
  while (AN.onsets.length && t - AN.onsets[0].t > 8) AN.onsets.shift();
  estimateTempo(t);
  if (AN.locked) {
    const p = AN.period, prev = AN.nextBeat - p;
    const near = Math.abs(t - prev) < Math.abs(t - AN.nextBeat) ? prev : AN.nextBeat;
    const e = t - near;
    if (Math.abs(e) < 0.3 * p) AN.nextBeat += e * 0.32;
  } else {
    fireBeat(strength * 0.85, false);
  }

const HIST = new Float32Array(81);
function estimateTempo(now) {
  HIST.fill(0);
  const o = AN.onsets; let total = 0;
  for (let i = 0; i < o.length; i++) for (let j = i + 1; j < o.length; j++) {
    const d = o[j].t - o[i].t; if (d < 0.25 || d > 3.2) continue;
    let bpm = 60 / d; while (bpm < 80) bpm *= 2; while (bpm >= 160) bpm /= 2;
    const n = Math.max(1, Math.round(d * bpm / 60));
    const age = Math.exp(-(now - o[j].t) / 4);
    const w = o[i].s * o[j].s * age / (1 + 0.45 * (n - 1));
    const x = bpm - 80, k = Math.floor(x), f = x - k;
    HIST[k] += w * (1 - f); if (k + 1 < 81) HIST[k + 1] += w * f;

  if (total <= 0 || o.length < 5) { AN.conf *= 0.9; AN.locked = AN.bpm > 0 && AN.conf > 0.14; return; }
  let best = 0, bi = 0;
  for (let i = 1; i < 80; i++) {
    const v = HIST[i - 1] * 0.25 + HIST[i] * 0.5 + HIST[i + 1] * 0.25;
    if (v > best) { best = v; bi = i; }
  }
  const a = HIST[bi - 1], b = HIST[bi], c = HIST[bi + 1] || 0;
  const off = (a - c) / (2 * (a - 2 * b + c) || 1);
  const est = 80 + bi + clamp(off, -0.5, 0.5);
  let win = 0; for (let i = Math.max(0, bi - 2); i <= Math.min(80, bi + 2); i++) win += HIST[i];
  AN.conf = AN.conf * 0.6 + (win / total) * 0.4;

  if (!AN.bpm) { if (AN.conf > 0.16) { AN.bpm = est; AN.nextBeat = now + 60 / est; } }
  else if (Math.abs(est - AN.bpm) < 3.5) { AN.bpm += (est - AN.bpm) * 0.2; AN.cand = 0; }
  else {
    if (!AN.cand || Math.abs(est - AN.cand) > 3) { AN.cand = est; AN.candSince = now; }
    else if (now - AN.candSince > 1.4) { AN.bpm = est; AN.cand = 0; AN.nextBeat = now + 60 / est; }
  }
  const recent = o.filter(x => now - x.t < 3).length;
  AN.locked = AN.bpm > 0 && AN.conf > 0.14 && recent >= 3;
}

function beatClock(now) {
  if (AN.locked && now - AN.lastOnset > 2.5) AN.locked = false;
  if (!AN.locked || !AN.bpm) return;
  AN.period = 60 / AN.bpm;
  if (now - AN.nextBeat > AN.period * 2) AN.nextBeat = AN.lastOnset + AN.period;
  while (now >= AN.nextBeat) {
    const slot = AN.beatCount % 4;
    AN.accent[slot] = AN.accent[slot] * 0.8 + (AN.fullFlux + AN.bands[0] * 0.5) * 0.2;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.userData.z = Math.max(6.4, 3.3 / (Math.tan(THREE.MathUtils.degToRad(20)) * camera.aspect));
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

let last = performance.now() / 1000, tAcc = 0, spinAcc = 0, procPulse = 0, hudTick = 0;
const gainEl = $('#sens');
const fibEl = $('#slFibroid');
const harmEl = $('#slHarmonic');
const freeEl = $('#slFreeRoom');
const symEl = $('#slSymBreak');
const meterEls = [$('#mLow'), $('#mMid'), $('#mHigh')];
const qTelemEl = $('#qTelem');

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, now - last); last = now;

  const st = STATES[stateName];
  const k = 1 - Math.pow(0.02, dt);
  K.amp = lerp(K.amp, st.amp, k);
  K.spin = lerp(K.spin, st.spin, k);
  K.inward = lerp(K.inward, st.inward, k);
  K.proc = lerp(K.proc, st.proc, k);
  K.vis = lerp(K.vis, visMode, k * 1.4);
  K.torusMorph = lerp(K.torusMorph, visMode === 2 ? 0.88 : 0.0, k * 1.3);

  const pTgt = getActivePaletteTarget();
  tgt.core.set(...pTgt.core); tgt.mid.set(...pTgt.mid); tgt.rim.set(...pTgt.rim); tgt.fib.set(...pTgt.fib);
  pal.core.lerp(tgt.core, k); pal.mid.lerp(tgt.mid, k); pal.rim.lerp(tgt.rim, k); pal.fib.lerp(tgt.fib, k);
  orbU.uMono.value = pTgt.mono || 0;

  const live = A.ctx && A.src !== 'none';
  const gain = parseFloat(gainEl.value);
  const fibInt = parseFloat(fibEl.value);
  const userL = parseFloat(harmEl.value);
  const freeRoom = parseFloat(freeEl.value);
  const symBreak = parseFloat(symEl.value);

  const audioTime = live ? A.ctx.currentTime : now;
  if (live) {
    analyse(audioTime, dt, gain);
    beatClock(audioTime);
  } else {
    AN.bands.forEach((v, i) => AN.bands[i] = v * 0.92);
    AN.level *= 0.92;
  }

  // Smoothly adapt Spherical Harmonic numbers (l, m) to live vocal formants (F1, F2) + user slider
  const f1Norm = clamp((AN.formantF1 - 260) / 600, 0, 1);
  const f2Norm = clamp((AN.formantF2 - 900) / 1800, 0, 1);
  const targetL = userL + (live ? (f1Norm * 1.4 + AN.centroid * 1.1) : 0.4 * Math.sin(now * 0.4));
  const targetM = Math.max(1.0, Math.min(targetL, st.mTarget + (live ? (f2Norm * 1.8 + AN.bands[1] * 0.9) : 0)));
  K.l = lerp(K.l, targetL, k * 0.85);
  K.m = lerp(K.m, targetM, k * 0.85);

  const procW = live ? K.proc : 1;
  const pb = 0.18 + 0.14 * Math.sin(now * 1.1) + (stateName === 'thinking' ? 0.22 * Math.sin(now * 2.3) : 0);
  const pm = 0.25 + 0.20 * Math.sin(now * 1.7 + 1) + (stateName === 'thinking' ? 0.30 * Math.abs(Math.sin(now * 3.1)) : 0);
  const pt = 0.20 + 0.20 * Math.sin(now * 2.9 + 2) + (stateName === 'thinking' ? 0.35 * Math.abs(Math.sin(now * 4.7)) : 0);

  const rawBass = lerp(AN.bands[0], pb, procW) * K.amp;
  const rawMid  = lerp(AN.bands[1], pm, procW) * K.amp;
  const rawTreb = lerp(AN.bands[2], pt, procW) * K.amp;
  const rawLvl  = Math.max(AN.level, procW * 0.25) * K.amp;

  // Step 2nd-Order Symplectic Hamiltonian Oscillator Bank
  stepHamiltonian(dt, [rawBass, rawMid, rawTreb, rawLvl], freeRoom);
  const bass = Math.max(0.02, lerp(rawBass, HAM.q[0], 0.55));
  const mid  = Math.max(0.02, lerp(rawMid,  HAM.q[1], 0.55));
  const treb = Math.max(0.02, lerp(rawTreb, HAM.q[2], 0.50));
  const level = Math.max(0.05, lerp(rawLvl, HAM.q[3], 0.50));

  if (!AN.locked) {
    procPulse -= dt;
    if (procPulse <= 0) {
      if (stateName === 'thinking') { fireBeat(0.45, false); procPulse = 0.55 + Math.random() * 0.35; }
      else if (!live) { fireBeat(0.28, false); procPulse = 3.2; }
      else procPulse = 0.5;
    }
  }

  const period = AN.locked ? AN.period : 0.5;
  beatEnv *= Math.exp(-dt / (period * 0.32));
  burst   *= Math.exp(-dt / (period * 0.55));
  punch   *= Math.exp(-dt / 0.12);
  const tempoK = AN.locked ? AN.bpm / 120 : 1;
  const phase = live ? beatPhase(audioTime) : 0;

  tAcc += dt * (0.52 + level * 1.05 + mid * 0.42) * tempoK;
  spinAcc += dt * K.spin * tempoK * (reduceMotion ? 0.4 : 1);

  // Update Orb & Fibroid Uniforms
  orbU.uT.value = tAcc;
  orbU.uBass.value = bass;
  orbU.uMid.value = mid;
  orbU.uTreb.value = treb;
  orbU.uBeat.value = beatEnv * K.amp;
  orbU.uLevel.value = level;
  orbU.uHarmL.value = K.l;
  orbU.uHarmM.value = K.m;
  orbU.uFreeRoom.value = freeRoom;
  orbU.uSymBreak.value = symBreak;
  orbU.uVisMode.value = K.vis;
  orbU.uTorusMorph.value = K.torusMorph;
  orbU.uFibIntensity.value = fibInt;
  orbU.uShowSurfFib.value = showOnBlobFib ? 1.0 : 0.0;
  orbU.uSharp.value = stateName === 'listening' ? 8.0 : 6.2;

  surfFibGroup.visible = showOnBlobFib && fibInt > 0.02;
  orbitalFibGroup.visible = showOrbitalFib && fibInt > 0.02;
  orbitalFibMat.uniforms.uInward.value = K.inward;

  orbit.yaw = lerp(orbit.yaw, orbit.tyaw, 0.12);
  orbit.pitch = lerp(orbit.pitch, orbit.tpitch, 0.12);

  const rotY = spinAcc * 0.14 + orbit.yaw;
  const rotX = Math.sin(now * 0.21) * 0.22 + orbit.pitch;
  orb.rotation.set(rotX, rotY, 0);
  surfFibGroup.rotation.set(rotX, rotY, 0);
  orbitalFibGroup.rotation.set(rotX * 0.65, -rotY * 0.8, Math.sin(now * 0.15) * 0.18);

  halo.scale.setScalar(0.88 * (1.52 + level * 0.32 + beatEnv * 0.14));
  haloU.uI.value = 0.34 + level * 0.52 + beatEnv * 0.35;

  // Spectrum Ring Bars
  bars.visible = showSpectrumRing;
  if (showSpectrumRing) {
    for (let b = 0; b < HALF; b++) {
      let v;
      if (live) {
        const lo = binOf(edges[b]), hi = Math.max(lo, binOf(edges[b + 1]));
        let s = 0; for (let i = lo; i <= hi; i++) s = Math.max(s, A.freq[i]);
        v = Math.pow(s / 255, 1.55) * gain * (0.75 + (b / HALF) * 0.6);
      } else v = 0;
      const pv = 0.06 + 0.42 * Math.pow(0.5 + 0.5 * Math.sin(b * 0.23 - now * (stateName === 'thinking' ? 4.2 : 1.4)), 4);
      v = lerp(v, pv, procW * 0.9) * K.amp;
      barVal[b] += (v - barVal[b]) * (v > barVal[b] ? 0.6 : 0.14);
    }
    const ringR = RING_R + beatEnv * 0.06;
    for (let i = 0; i < NB; i++) {
      const b = i < HALF ? i : NB - 1 - i;
      const a = Math.PI / 2 + (i / NB) * Math.PI * 2 + spinAcc * 0.05;
      const h = 0.03 + clamp(barVal[b], 0, 1.3) * 0.85;
      dummy.position.set(Math.cos(a) * ringR, Math.sin(a) * ringR, 0);
      dummy.rotation.set(0, 0, a - Math.PI / 2);
      dummy.scale.set(0.022, h, 0.022);
      dummy.updateMatrix();
      bars.setMatrixAt(i, dummy.matrix);
      const c = clamp(barVal[b] * 1.2, 0, 1);
      tmpC.setRGB(lerp(pal.mid.x, pal.rim.x, c), lerp(pal.mid.y, pal.rim.y, c), lerp(pal.mid.z, pal.rim.z, c));
      bars.setColorAt(i, tmpC);
    }
    bars.instanceMatrix.needsUpdate = true;
    bars.instanceColor.needsUpdate = true;
  }

  // Waveform & Echo Loops
  const step = live ? Math.floor(A.time.length / WN) : 0;
  for (let i = 0; i < WN; i++) {
    const win = Math.sin((Math.PI * i) / WN);
    let s = live ? A.time[i * step] * gain * 2.2 : 0;
    s = lerp(s, 0.18 * Math.sin(i * 0.18 + now * 2.2) * Math.sin(i * 0.05 - now * 0.7), procW * 0.8);
    echoBuf[i] = lerp(echoBuf[i], waveBuf[i], 0.18);
    waveBuf[i] = s * win * K.amp;
  }
  const wp = wave.geometry.attributes.position.array, ep = waveEcho.geometry.attributes.position.array;
  const wr = 1.52 + beatEnv * 0.04;
  for (let i = 0; i < WN; i++) {
    const a = (i / WN) * Math.PI * 2 + Math.PI / 2;
    const r1 = wr + clamp(waveBuf[i], -0.35, 0.35), r2 = wr * 1.035 + clamp(echoBuf[i], -0.35, 0.35);
    wp[i * 3] = Math.cos(a) * r1; wp[i * 3 + 1] = Math.sin(a) * r1; wp[i * 3 + 2] = 0;
    ep[i * 3] = Math.cos(a) * r2; ep[i * 3 + 1] = Math.sin(a) * r2; ep[i * 3 + 2] = 0;
  }
  wave.geometry.attributes.position.needsUpdate = true;
  waveEcho.geometry.attributes.position.needsUpdate = true;
  wave.material.color.setRGB(pal.fib.x, pal.fib.y, pal.fib.z);
  waveEcho.material.color.setRGB(pal.mid.x, pal.mid.y, pal.mid.z);

  // Particles
  pU.uT.value = now; pU.uSpin.value = spinAcc; pU.uBurst.value = burst;
  pU.uBass.value = bass; pU.uTreb.value = treb; pU.uInward.value = K.inward;
  pU.uOp.value = 0.62 + level * 0.38;

  // 3D Toroidal Quantized Vortex Ring Shockwaves
  shocks.forEach(m => {
    if (!m.visible) return;
    const u = m.userData; u.age += dt;
    const p = u.age / u.life;
    if (p >= 1) { m.visible = false; return; }
    const e = 1 - Math.pow(1 - p, 3);
    m.scale.setScalar(u.s * (1.02 + e * 2.55));
    m.rotation.set(u.rx * (1 + p * 0.4), u.ry * (1 + p * 0.4), now * 0.25);
    m.material.opacity = (1 - p) * (1 - p) * u.str * 0.88;
    m.material.color.setRGB(pal.fib.x, pal.fib.y, pal.fib.z);
  });

  // Non-overlapping vertical shift & scale when Tweak Drawer is open so the entire 3D visual & ring stay 100% unobstructed
  const drawerOpen = $('#tweakDrawer').classList.contains('open');
  const targetY = drawerOpen ? (camMode === 'macro' ? 0.28 : 0.34) : 0.05;
  const targetScale = drawerOpen ? (camMode === 'macro' ? 0.78 : 0.84) : 1.0;
  world.position.y = lerp(world.position.y, targetY, 0.14);
  world.scale.setScalar(lerp(world.scale.x, targetScale, 0.14));

  // Dynamic Sanzo Wada / Monotone deep atmospheric room tone
  bgClearColor.setRGB(pal.core.x * 0.22, pal.core.y * 0.22, pal.core.z * 0.26);
  renderer.setClearColor(bgClearColor, 1);

  // 4-Mode 3D Camera Choreography + Mouse-Wheel Zoom
  const baseZ = clamp(camera.userData.z + zoomOffset, 3.2, 10.5);
  const sway = reduceMotion ? 0 : 1;
  let camX = Math.sin(now * 0.11) * 0.42 * sway;
  let camY = Math.cos(now * 0.13) * 0.28 * sway;
  let camZ = baseZ - punch * 0.18 * sway - Math.sin(phase * Math.PI) * 0.04 * sway;
  let lookY = 0;

  if (camMode === 'iso') {
    camX += 1.85;
    camY += 1.15;
    camZ = baseZ * 0.96;
    lookY = drawerOpen ? -0.18 : 0.0;
  } else if (camMode === 'orbit') {
    const orbAng = now * 0.34;
    camX = Math.sin(orbAng) * baseZ * 0.58;
    camY = 0.72 * Math.sin(orbAng * 0.65);
    camZ = Math.cos(orbAng) * baseZ * 0.94;
    lookY = drawerOpen ? -0.14 : 0.0;
  } else if (camMode === 'macro') {
    camX = Math.sin(now * 0.18) * 0.45 * sway;
    camY = 0.24 + Math.cos(now * 0.15) * 0.18 * sway;
    camZ = Math.max(3.65, baseZ * 0.72 - punch * 0.10);
    lookY = drawerOpen ? 0.06 : 0.05;
  }
  camera.position.set(camX, camY, camZ);
  camera.lookAt(0, lookY, 0);
  world.rotation.z = Math.sin(now * 0.05) * 0.04 * sway;

  renderer.render(scene, camera);

  // Hands-Free Mic Voice-Activity Conversational Auto-Turn (VAD)
  if (A.src === 'mic' && autoVadOn) {
    stepMicVad(dt, AN.level);
  }

  // Update HUD Readouts, Audio Scrubber & Conserved Quantum Telemetry
  $('#pip').style.transform = `scale(${1 + beatEnv * 0.7})`;
  if (++hudTick % 4 === 0) {
    $('#bpm').textContent = AN.locked ? Math.round(AN.bpm) : '—';
    const lock = $('#lock');
    const isVoice = (A.src === 'voice' || A.src === 'mic');
    const lt = !live ? 'Harmonic' : AN.locked ? 'Locked' : (isVoice ? `Voice · F1 ${Math.round(AN.formantF1)}Hz` : 'Searching');
    if (lock.textContent !== lt) { lock.textContent = lt; lock.dataset.on = AN.locked ? '1' : '0'; }
    meterEls.forEach((el, i) => el.style.width = (clamp([bass, mid, treb][i], 0, 1) * 100).toFixed(1) + '%');
    if (!AN.locked) $$('#bar i').forEach(el => el.classList.remove('on'));
    qTelemEl.textContent = `Y_${K.l.toFixed(1)}^${K.m.toFixed(1)} · H ${HAM.energy.toFixed(2)} · ε ${symBreak.toFixed(2)}`;

    if (A.src === 'file' && A.media && A.media.duration) {
      const cur = A.media.currentTime || 0, dur = A.media.duration || 1;
      $('#mediaSeek').value = String(Math.round((cur / dur) * 1000));
      const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      $('#mediaTime').textContent = `${fmt(cur)} / ${fmt(dur)}`;
    }
  }
}

/* ── Hands-Free Live Microphone Voice-Activity Auto-Turn State Machine ── */
const VAD = { speakingTime: 0, silenceTime: 0, phase: 'listen', phaseTimer: 0 };
function stepMicVad(dt, lvl) {
  if (VAD.phase === 'listen') {
    if (lvl > 0.16) {
      VAD.speakingTime += dt;
      VAD.silenceTime = 0;
      if (stateName !== 'listening') setState('listening');
    } else if (VAD.speakingTime > 0.45) {
      VAD.silenceTime += dt;
      if (VAD.silenceTime > 1.15) {
        VAD.phase = 'think';
        VAD.phaseTimer = 1.4;
        VAD.speakingTime = 0;
        VAD.silenceTime = 0;
        setState('thinking');
      }
    }
  } else if (VAD.phase === 'think') {
    VAD.phaseTimer -= dt;
    if (VAD.phaseTimer <= 0) {
      VAD.phase = 'respond';
      VAD.phaseTimer = 2.8;
      setState('speaking');
      playHarmonicChime(60, K.l, K.m);
    }
  } else if (VAD.phase === 'respond') {
    VAD.phaseTimer -= dt;
    if (lvl > 0.22 || VAD.phaseTimer <= 0) {
      VAD.phase = 'listen';
      setState('listening');
    }
  }
}

let mediaRec = null, recChunks = [];
function toggleVideoRecord() {
  const btn = $('#bRecVideo');
  if (mediaRec && mediaRec.state === 'recording') {
    mediaRec.stop();
    btn.classList.remove('rec-on');
    btn.textContent = 'Rec';
    return;
  }
  try {
    ensureAudio();
    const canvasStream = canvas.captureStream(60);
    const audioDest = A.ctx.createMediaStreamDestination();
    A.master.connect(audioDest);
    const tracks = [...canvasStream.getVideoTracks(), ...audioDest.stream.getAudioTracks()];
    const combined = new MediaStream(tracks);
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus'
      : 'video/webm';
    recChunks = [];
    mediaRec = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 8000000 });
    mediaRec.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };
    mediaRec.onstop = () => {
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `noether-resonance-capture-${Date.now()}.webm`;
      a.click();
      toast('Saved 60fps WebM video + audio recording');
    };
    mediaRec.start();
    btn.classList.add('rec-on');
    btn.textContent = 'Stop Rec';
    toast('Recording 60fps WebM video + audio... Click Stop Rec when finished.');
  } catch (e) {
    toast('Video recording requires Chrome, Edge, Arc, or Firefox.');
  }
}

/* ───────────────────────── Preset Persistence (URL Hash + LocalStorage) ───────────────────────── */
function saveAndSharePreset() {
  const params = new URLSearchParams();
  params.set('mode', String(visMode));
  params.set('pal', paletteMode);
  params.set('cam', camMode);
  params.set('trk', String(activeTrackIdx));
  params.set('fib', fibEl.value);
  params.set('l', harmEl.value);
  params.set('free', freeEl.value);
  params.set('eps', symEl.value);
  params.set('onblob', showOnBlobFib ? '1' : '0');
  params.set('orbital', showOrbitalFib ? '1' : '0');
  params.set('ring', showSpectrumRing ? '1' : '0');
  const hash = '#' + params.toString();
  try {
    history.replaceState(null, '', hash);
    localStorage.setItem('noether_resonance_preset', params.toString());
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).catch(() => {});
    }
  } catch (e) {}
  toast('Saved preset to browser & copied shareable URL hash (' + hash + ')');
}

function loadPresetFromHashOrStorage() {
  try {
    const raw = location.hash.length > 1 ? location.hash.slice(1) : localStorage.getItem('noether_resonance_preset');
    if (!raw) return;
    const p = new URLSearchParams(raw);
    if (p.has('mode')) {
      visMode = clamp(parseInt(p.get('mode'), 10) || 0, 0, 4);
      $$('[data-vismode]').forEach(x => x.setAttribute('aria-pressed', String(parseInt(x.dataset.vismode, 10) === visMode)));
    }
    if (p.has('pal') && (WADA_PALETTES[p.get('pal')] || p.get('pal') === 'wada_auto')) {
      paletteMode = p.get('pal');
      $$('[data-pal]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.pal === paletteMode)));
      applyAccentColor();
    }
    if (p.has('cam')) {
      camMode = p.get('cam');
      $$('[data-cam]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cam === camMode)));
    }
    if (p.has('trk')) {
      activeTrackIdx = clamp(parseInt(p.get('trk'), 10) || 0, 0, TRACK_LIBRARY.length - 1);
      $('#trackSelect').value = String(activeTrackIdx);
    }
    if (p.has('fib')) fibEl.value = p.get('fib');
    if (p.has('l')) harmEl.value = p.get('l');
    if (p.has('free')) freeEl.value = p.get('free');
    if (p.has('eps')) symEl.value = p.get('eps');
    if (p.has('onblob')) {
      showOnBlobFib = p.get('onblob') !== '0';
      $('#bOnBlobFib').setAttribute('aria-pressed', String(showOnBlobFib));
    }
    if (p.has('orbital')) {
      showOrbitalFib = p.get('orbital') !== '0';
      $('#bOrbitalFib').setAttribute('aria-pressed', String(showOrbitalFib));
    }
    if (p.has('ring')) {
      showSpectrumRing = p.get('ring') !== '0';
      $('#bRingToggle').setAttribute('aria-pressed', String(showSpectrumRing));
    }
  } catch (e) {}
}

  ensureAudio(); stopAll(); startVoice('agent', 0); setSource('voice', 'Agent voice · harmonic formant synthesis'); setState('speaking');
};
$('#bMic').onclick = () => A.src === 'mic' ? (stopAll(), setState('idle')) : startMic($('#micDeviceSelect').value);
$('#bSysAudio').onclick = () => A.src === 'sys' ? (stopAll(), setState('idle')) : startSystemAudio();
$('#bStop').onclick = () => { toggleShowcase(false); stopAll(); setState('idle'); };
$('#bTurn').onclick = () => { toggleShowcase(false); agentTurn(); };
$('#bShowcase').onclick = () => toggleShowcase();
$('#bSharePreset').onclick = saveAndSharePreset;
$('#bSnapPng').onclick = downloadPngSnapshot;
$('#bRecVideo').onclick = toggleVideoRecord;
$('#file').onchange = e => { const f = e.target.files[0]; if (f) { toggleShowcase(false); playFile(f); } e.target.value = ''; };

$('#bMediaPause').onclick = () => {
  if (!A.media) return;
  if (A.media.paused) { A.media.play(); $('#bMediaPause').textContent = 'Pause'; }
  else { A.media.pause(); $('#bMediaPause').textContent = 'Play'; }
};
$('#mediaSeek').oninput = e => {
  if (A.media && A.media.duration) {
    A.media.currentTime = (parseFloat(e.target.value) / 1000) * A.media.duration;
  }
};

$('#micDeviceSelect').onchange = e => {
  if (A.src === 'mic') startMic(e.target.value);
};

$$('[data-state]').forEach(b => b.onclick = () => { turnId++; setState(b.dataset.state); });

// Tweak Drawer toggle
const tweakDrawer = $('#tweakDrawer');
const bTweaks = $('#bTweaks');
bTweaks.onclick = () => {
  const open = tweakDrawer.classList.toggle('open');
  bTweaks.setAttribute('aria-pressed', String(open));
  bTweaks.textContent = open ? 'Tweaks ▾' : 'Tweaks ▴';
};

// Visualizer Field Mode buttons
$$('[data-vismode]').forEach(b => b.onclick = () => {
  visMode = parseInt(b.dataset.vismode, 10);
  $$('[data-vismode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});

// Camera Choreography buttons
$$('[data-cam]').forEach(b => b.onclick = () => {
  camMode = b.dataset.cam;
  zoomOffset = 0;
  orbit.tyaw = 0; orbit.tpitch = 0;
  $$('[data-cam]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});

// Sanzo Wada & Monotone Palette buttons
$$('[data-pal]').forEach(b => b.onclick = () => {
  paletteMode = b.dataset.pal;
  $$('[data-pal]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  applyAccentColor();
});

// Fibroid, Ring & Auto-VAD toggles
$('#bOnBlobFib').onclick = function () {
  showOnBlobFib = !showOnBlobFib;
  this.setAttribute('aria-pressed', String(showOnBlobFib));
};
$('#bOrbitalFib').onclick = function () {
  showOrbitalFib = !showOrbitalFib;
  this.setAttribute('aria-pressed', String(showOrbitalFib));
};
$('#bRingToggle').onclick = function () {
  showSpectrumRing = !showSpectrumRing;
  this.setAttribute('aria-pressed', String(showSpectrumRing));
};
$('#bAutoVad').onclick = function () {
  autoVadOn = !autoVadOn;
  this.setAttribute('aria-pressed', String(autoVadOn));
};

// Musical Keyboard Chime Mapping (A S D F G H J K L) + Scene Shortcuts (5-9) + State Shortcuts (1-4, Space, T, U)
const KEY_NOTES = { a: 57, s: 60, d: 62, f: 64, g: 67, h: 69, j: 72, k: 74, l: 76 };
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select')) return;
  const map = { '1': 'idle', '2': 'listening', '3': 'thinking', '4': 'speaking' };
  const sceneMap = { '5': 0, '6': 1, '7': 2, '8': 3, '9': 4 };
  const kl = e.key.toLowerCase();
  if (map[e.key]) { turnId++; setState(map[e.key]); }
  else if (sceneMap[e.key] !== undefined) { applyShowcaseScene(sceneMap[e.key]); }
  else if (e.key === ' ') { e.preventDefault(); Demo.on ? stopAll() : startDemo(); }
  else if (kl === 't') bTweaks.click();
  else if (kl === 'u') document.body.classList.toggle('ui-off');
  else if (KEY_NOTES[kl]) {
    playHarmonicChime(KEY_NOTES[kl], K.l, K.m);
  }
});

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0]; if (f) { toggleShowcase(false); playFile(f); }
});

/* External Integration API for Real AI Voice / Audio Agents */
window.noetherResonance = {
  setState,
  setPalette: (p) => { if (WADA_PALETTES[p] || p === 'wada_auto') { paletteMode = p; applyAccentColor(); } },
  setFieldMode: (m) => { visMode = clamp(m, 0, 4); },
  setCamera: (c) => { if (['front', 'iso', 'orbit', 'macro'].includes(c)) { camMode = c; $$('[data-cam]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cam === c))); } },
  setTrack: (idx) => { activeTrackIdx = clamp(idx, 0, TRACK_LIBRARY.length - 1); $('#trackSelect').value = String(activeTrackIdx); if (Demo.on) startDemo(); },
  applyScene: (idx) => applyShowcaseScene(idx),
  toggleShowcase,
  snapshotPng: downloadPngSnapshot,
  playChime: (midi, l, m) => playHarmonicChime(midi || 64, l || K.l, m || K.m),
  connectStream: (stream, label) => attachStream(stream, 'mic', label || 'External stream'),
  connectNode: node => { ensureAudio(); node.connect(A.analyser); setSource('node', 'External audio node'); },
  get telemetry() { return { state: stateName, visMode, paletteMode, camMode, showcaseOn, l: K.l, m: K.m, energyH: HAM.energy, bpm: AN.bpm, locked: AN.locked, f1: AN.formantF1, f2: AN.formantF2 }; },
  get audioContext() { return ensureAudio(); },
  stop: () => { toggleShowcase(false); stopAll(); setState('idle'); }
};
})();
</script>
</body>
</html>
